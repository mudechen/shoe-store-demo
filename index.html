<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shoe-store-demo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>實體鞋店全流程庫存視覺化系統 | Shoe Store Matrix Inventory</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('shoe_store_font_size_mode');
          if (mode === 'small') {
            document.documentElement.dataset.fontSize = 'small';
            document.documentElement.style.fontSize = '14.4px';
            document.documentElement.style.setProperty('--app-font-scale', '0.9');
          } else if (mode === 'standard') {
            document.documentElement.dataset.fontSize = 'standard';
            document.documentElement.style.fontSize = '16px';
            document.documentElement.style.setProperty('--app-font-scale', '1');
          } else if (mode === 'large') {
            document.documentElement.dataset.fontSize = 'large';
            document.documentElement.style.fontSize = '18px';
            document.documentElement.style.setProperty('--app-font-scale', '1.125');
          } else if (mode === 'xlarge') {
            document.documentElement.dataset.fontSize = 'xlarge';
            document.documentElement.style.fontSize = '20px';
            document.documentElement.style.setProperty('--app-font-scale', '1.25');
          } else if (mode === 'auto') {
            document.documentElement.dataset.fontSize = 'auto';
            var w = window.innerWidth;
            var px = w < 360 ? 14.8 : (w <= 440 ? 16 : 16.5);
            var scale = w < 360 ? 0.925 : (w <= 440 ? 1.0 : 1.03125);
            document.documentElement.style.fontSize = px + 'px';
            document.documentElement.style.setProperty('--app-font-scale', String(scale));
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/shoe-store-demo/assets/index-DyjyNvha.js"></script>
    <link rel="stylesheet" crossorigin href="/shoe-store-demo/assets/index-vvvbrri3.css">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 overflow-x-hidden">
    <div id="root" class="min-h-screen flex flex-col"></div>
  </body>
</html>
